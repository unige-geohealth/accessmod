name: AccessMod Build Pipeline

on:
  push:
    branches:
      - main
      - staging
    tags:
      - "5.*"
  schedule:
    # Run at 5am UTC (7am CEST) every Monday
    - cron: "0 5 * * 1"

env:
  DOCKER_REPO: "fredmoser"
  DOCKER_NAME: "accessmod"
  DOCKER_TAG_TEST: "test"
  DOCKER_TAG_LATEST: "latest"
  PACKER_VERSION: "1.10.1"

jobs:
  # Single source of truth for version
  set-version:
    runs-on: ubuntu-latest
    name: Set version for all jobs
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.release_context.outputs.is_prerelease }}
      is_stable_release: ${{ steps.release_context.outputs.is_stable_release }}
      publish_prerelease: ${{ steps.release_context.outputs.publish_prerelease }}
      publish_stable: ${{ steps.release_context.outputs.publish_stable }}
      publish_release: ${{ steps.release_context.outputs.publish_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from version.txt
        id: get_version
        run: echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"

      - name: Set release context
        id: release_context
        run: |
          version="${{ steps.get_version.outputs.version }}"
          is_tag=false
          on_main=false
          on_staging=false
          is_prerelease=false
          is_stable_release=false
          publish_prerelease=false
          publish_stable=false

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            is_tag=true
            if [[ "${GITHUB_REF_NAME}" != "$version" ]]; then
              echo "::error::Tag '${GITHUB_REF_NAME}' does not match version.txt '$version'."
              exit 1
            fi
            git fetch --quiet origin main:refs/remotes/origin/main staging:refs/remotes/origin/staging
            if git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
              on_main=true
            fi
            if git merge-base --is-ancestor "${GITHUB_SHA}" origin/staging; then
              on_staging=true
            fi
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            on_main=true
          elif [[ "${GITHUB_REF_NAME}" == "staging" ]]; then
            on_staging=true
          fi

          if [[ "$version" == *-alpha* || "$version" == *-beta* ]]; then
            is_prerelease=true
          else
            is_stable_release=true
          fi

          if [[ "$is_tag" == "true" && "$on_staging" == "true" && "$is_prerelease" == "true" ]]; then
            publish_prerelease=true
          fi

          if [[ "$is_tag" == "true" && "$on_main" == "true" && "$is_stable_release" == "true" ]]; then
            publish_stable=true
          fi

          if [[ "$is_tag" == "true" && "$publish_prerelease" != "true" && "$publish_stable" != "true" ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' will not publish. Stable tags must point to main; alpha/beta tags must point to staging."
            exit 1
          fi

          {
            echo "is_prerelease=$is_prerelease"
            echo "is_stable_release=$is_stable_release"
            echo "publish_prerelease=$publish_prerelease"
            echo "publish_stable=$publish_stable"
            echo "publish_release=$([[ "$publish_prerelease" == "true" || "$publish_stable" == "true" ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  # Fast native test before the more expensive architecture and packaging jobs.
  docker-test:
    runs-on: ubuntu-latest
    needs: set-version
    name: Test Docker image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run QEMU script tests
        run: npm run test:qemu

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test version
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          load: true
          tags: ${{ env.DOCKER_REPO }}/${{ env.DOCKER_NAME }}:${{ env.DOCKER_TAG_TEST }}
          cache-from: type=gha,scope=docker-test
          cache-to: type=gha,mode=max,scope=docker-test

      - name: Run tests
        env:
          DOCKER_TAG: "${{ env.DOCKER_TAG_TEST }}"
        run: ./test.sh

  # Build each architecture once and pass it to QEMU/Electron without using
  # Docker Hub as an intermediate registry.
  image-artifacts:
    runs-on: ubuntu-latest
    needs: [set-version, docker-test]
    name: Build Docker image artifact (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.arch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare artifact directory
        run: mkdir -p docker-image

      - name: Build architecture image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.DOCKER_REPO }}/${{ env.DOCKER_NAME }}:${{ needs.set-version.outputs.version }}
          outputs: type=docker,dest=/tmp/accessmod-${{ matrix.arch }}.tar
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Package Docker image
        run: |
          gzip -9 -c /tmp/accessmod-${{ matrix.arch }}.tar > docker-image/docker_image.tar.gz
          echo "${{ needs.set-version.outputs.version }}" > docker-image/version

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.arch }}
          path: docker-image
          retention-days: 1

  # Only a valid, deliberately pushed release tag may publish to Docker Hub.
  docker-publish:
    runs-on: ubuntu-latest
    needs: [set-version, image-artifacts]
    if: ${{ needs.set-version.outputs.publish_release == 'true' }}
    name: Publish Docker image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker tags
        id: docker_tags
        run: |
          {
            echo "tags<<EOF"
            echo "${{ env.DOCKER_REPO }}/${{ env.DOCKER_NAME }}:${{ needs.set-version.outputs.version }}"
            if [[ "${{ needs.set-version.outputs.publish_stable }}" == "true" ]]; then
              echo "${{ env.DOCKER_REPO }}/${{ env.DOCKER_NAME }}:${{ env.DOCKER_TAG_LATEST }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
          cache-from: |
            type=gha,scope=docker-amd64
            type=gha,scope=docker-arm64

  # Qemu  : get the docker archive and build the ova
  qemu:
    runs-on: ubuntu-latest
    needs: [set-version, image-artifacts]
    name: Build QEMU VM image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            vm_arch: x86_64
          - arch: arm64
            vm_arch: aarch64
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install qemu-utils
          sudo modprobe nbd max_part=16

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU userspace emulation
        if: ${{ matrix.arch == 'arm64' }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Check ARM emulation
        if: ${{ matrix.arch == 'arm64' }}
        run: |
          docker run --rm --platform linux/arm64 alpine:3.21 uname -m

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ matrix.arch }}
          path: ./qemu/fs/home/accessmod

      - name: Set up Alpine Linux
        uses: jirutka/setup-alpine@v1
        with:
          branch: v3.21

      - name: Set version
        run: |
          # Use the same version for VM as for AccessMod
          echo "BUILD_VERSION=${{ needs.set-version.outputs.version }}" >> "$GITHUB_ENV"

          # Get Docker image version from the artifact
          AM5_VERSION=$(cat ./qemu/fs/home/accessmod/version)
          echo "AM5_VERSION=$AM5_VERSION" >> "$GITHUB_ENV"
        shell: bash

      - name: Build VM Image
        run: |
          cd qemu
          apk add --no-cache alpine-make-vm-image qemu-img docker bash tar util-linux
          # Build VM and perform OVA conversion within build.sh
          ./build.sh "${{ matrix.vm_arch }}" "${BUILD_VERSION}"
        shell: alpine.sh --root {0}

      - name: Upload VM image
        uses: actions/upload-artifact@v4
        with:
          name: accessmod-vm-${{ matrix.arch }}
          path: qemu/_build
          if-no-files-found: warn

  # Electron
  update_image:
    runs-on: ubuntu-latest
    needs: [set-version, image-artifacts]
    # Always run on staging and main
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: macos-14
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: echo "AM_VERSION=${{ needs.set-version.outputs.version }}" >> "$GITHUB_ENV"

      - name: Use docker
        uses: actions-hub/docker/cli@master
        env:
          SKIP_LOGIN: true

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{matrix.arch}}
          path: ./electron/resources/docker/

      - name: Update image
        working-directory: ./electron
        run: ./update_image.sh
        shell: bash

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: accessmod-docker-archive-${{ matrix.arch }}
          path: ./electron/resources/docker/accessmod-docker.tar.gz

  electron:
    runs-on: ${{ matrix.os }}
    needs: [set-version, update_image]
    # Always run on staging and main
    strategy:
      matrix:
        include:
          - os: macos-14
            platform: mac
            arch: arm64
            build_script: build:mac:arm
            preview_build_script: build:mac:arm:preview
          - os: ubuntu-22.04
            platform: linux
            arch: amd64
            build_script: build:linux
            preview_build_script: build:linux
          - os: macos-14
            platform: mac
            arch: amd64
            build_script: build:mac
            preview_build_script: build:mac:preview
          - os: windows-2022
            platform: win
            arch: amd64
            build_script: build:win
            preview_build_script: build:win
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          echo "AM_VERSION=${{ needs.set-version.outputs.version }}" >> "$GITHUB_ENV"
          if [[ "${{ needs.set-version.outputs.publish_stable }}" == "true" ]]; then
            echo "IS_STABLE_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_STABLE_RELEASE=false" >> "$GITHUB_ENV"
          fi
        shell: bash

      - uses: actions/download-artifact@v4
        with:
          name: accessmod-docker-archive-${{ matrix.arch }}
          path: ./electron/resources/docker/

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Dependencies
        working-directory: ./electron
        run: yarn install

      - name: Prepare Apple API key
        if: ${{ matrix.platform == 'mac' && needs.set-version.outputs.publish_stable == 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/apple-notarization"
          key_path="$RUNNER_TEMP/apple-notarization/AuthKey_${APPLE_API_KEY_ID}.p8"
          if base64 --help 2>&1 | grep -q -- "--decode"; then
            printf "%s" "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"
          else
            printf "%s" "$APPLE_API_KEY_BASE64" | base64 -D > "$key_path"
          fi
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}

      - name: Check Apple notarization access
        if: ${{ matrix.platform == 'mac' && needs.set-version.outputs.publish_stable == 'true' }}
        run: xcrun notarytool history --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # Build using the predefined scripts in package.json
      - name: Build Electron App
        working-directory: ./electron
        run: |
          if [[ "${{ matrix.platform }}" == "mac" && "$IS_STABLE_RELEASE" != "true" ]]; then
            yarn ${{ matrix.preview_build_script }}
          else
            yarn ${{ matrix.build_script }}
          fi
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform != 'mac' && 'false' || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && needs.set-version.outputs.publish_stable == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && needs.set-version.outputs.publish_stable == 'true' && secrets.APPLE_API_ISSUER || '' }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.APPLE_CERTIFICATE_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: accessmod-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ./electron/dist/*.dmg
            ./electron/dist/*.deb
            ./electron/dist/*-setup.exe

  # Release tag builds. Stable releases come from main; prereleases come from staging.
  release:
    runs-on: ubuntu-latest
    needs: [set-version, docker-publish, qemu, electron]
    if: ${{ needs.set-version.outputs.publish_release == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        run: echo "AM_VERSION=${{ needs.set-version.outputs.version }}" >> "$GITHUB_ENV"

      - name: Write prerelease notes
        if: ${{ needs.set-version.outputs.publish_prerelease == 'true' }}
        run: |
          {
            printf '# AccessMod %s prerelease\n\n' "$AM_VERSION"
            printf 'This is an unstable AccessMod test build from the staging branch.\n\n'
            printf 'Use it only for testing or validation before a stable release. It is not recommended for production work.\n\n'
            printf 'Docker image:\n\n'
            printf '```bash\n'
            printf 'docker pull %s/%s:%s\n' "${{ env.DOCKER_REPO }}" "${{ env.DOCKER_NAME }}" "$AM_VERSION"
            printf '```\n'
          } > prerelease_notes.md

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./accessmod-release
          pattern: accessmod-*

      - name: List files for release
        run: ls -R ./accessmod-release

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.set-version.outputs.version }}
          prerelease: ${{ needs.set-version.outputs.publish_prerelease == 'true' }}
          make_latest: ${{ needs.set-version.outputs.publish_stable == 'true' }}
          files: |
            ./accessmod-release/**/*.deb
            ./accessmod-release/**/*.dmg
            ./accessmod-release/**/*.exe
            ./accessmod-release/**/*.ova
          body_path: ${{ needs.set-version.outputs.publish_prerelease == 'true' && './prerelease_notes.md' || './release_notes.md' }}
          token: ${{ secrets.github_token }}
