name: AccessMod Build Pipeline

on:
  push:
    branches:
      - main
      - staging
  schedule:
    # Run at 5am UTC (7am CEST) every Monday
    - cron: "0 5 * * 1"

env:
  DOCKER_REPO: "fredmoser"
  DOCKER_NAME: "accessmod"
  DOCKER_TAG_TEST: "test"
  DOCKER_TAG_LATEST: "latest"
  PACKER_VERSION: "1.10.1"

jobs:
  # Single source of truth for version
  set-version:
    runs-on: ubuntu-latest
    name: Set version for all jobs
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from version.txt
        id: get_version
        run: echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"

  # Docker
  docker:
    runs-on: ubuntu-latest
    needs: set-version
    name: Test and build docker images
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set version
        run: echo "AM_VERSION=${{ needs.set-version.outputs.version }}" >> "$GITHUB_ENV"

      - name: Build test version
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          load: true
          tags: ${{ env.DOCKER_REPO }}/${{ env.DOCKER_NAME }}:${{ env.DOCKER_TAG_TEST }}

      - name: Run tests
        env:
          DOCKER_TAG: "${{ env.DOCKER_TAG_TEST }}"
        run: ./test.sh

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}/${{ env.DOCKER_NAME }}:${{ env.AM_VERSION }}
            ${{ env.DOCKER_REPO }}/${{ env.DOCKER_NAME }}:${{ env.DOCKER_TAG_LATEST }}

  # Save docker image for qemu and electron, per architecture
  save-artifacts:
    runs-on: ubuntu-latest
    needs: [set-version, docker]
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Set version
        run: echo "AM_VERSION=${{ needs.set-version.outputs.version }}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull and save image
        run: |
          mkdir -p docker-image
          docker pull --platform linux/${{ matrix.arch }} ${{ env.DOCKER_REPO }}/${{ env.DOCKER_NAME }}:${{ env.AM_VERSION }}
          docker save ${{ env.DOCKER_REPO }}/${{ env.DOCKER_NAME }}:${{ env.AM_VERSION }} | gzip -9 > docker-image/docker_image.tar.gz
          echo "${{ env.AM_VERSION }}" > docker-image/version

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.arch }}
          path: docker-image
          retention-days: 1

  # Qemu  : get the docker archive and build the ova
  qemu:
    runs-on: ubuntu-latest
    needs: [set-version, docker, save-artifacts]
    name: Build QEMU VM image
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install qemu-utils
          sudo modprobe nbd max_part=16

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-amd64
          path: ./qemu/fs/home/accessmod

      - name: Set up Alpine Linux
        uses: jirutka/setup-alpine@v1
        with:
          branch: v3.21

      - name: Set version
        run: |
          # Use the same version for VM as for AccessMod
          echo "BUILD_VERSION=${{ needs.set-version.outputs.version }}" >> "$GITHUB_ENV"

          # Get Docker image version from the artifact
          AM5_VERSION=$(cat ./qemu/fs/home/accessmod/version)
          echo "AM5_VERSION=$AM5_VERSION" >> "$GITHUB_ENV"
        shell: bash

      - name: Build VM Image
        run: |
          cd qemu
          apk add --no-cache alpine-make-vm-image qemu-img docker bash tar util-linux
          # Build VM and perform OVA conversion within build.sh
          ./build.sh x86_64 "${BUILD_VERSION}"
        shell: alpine.sh --root {0}

      - name: Upload VM image
        uses: actions/upload-artifact@v4
        with:
          name: accessmod-vm-amd64
          path: qemu/_build
          if-no-files-found: warn

  # Electron
  update_image:
    runs-on: ubuntu-latest
    needs: [set-version, docker, save-artifacts]
    # Always run on staging and main
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: macos-14
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: echo "AM_VERSION=${{ needs.set-version.outputs.version }}" >> "$GITHUB_ENV"

      - name: Use docker
        uses: actions-hub/docker/cli@master
        env:
          SKIP_LOGIN: true

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{matrix.arch}}
          path: ./electron/resources/docker/

      - name: Update image
        working-directory: ./electron
        run: ./update_image.sh
        shell: bash

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: accessmod-docker-archive-${{ matrix.arch }}
          path: ./electron/resources/docker/accessmod-docker.tar.gz

  electron:
    runs-on: ${{ matrix.os }}
    needs: [set-version, update_image]
    # Always run on staging and main
    strategy:
      matrix:
        include:
          - os: macos-14
            platform: mac
            arch: arm64
            build_script: build:mac:arm
            preview_build_script: build:mac:arm:preview
          - os: ubuntu-22.04
            platform: linux
            arch: amd64
            build_script: build:linux
            preview_build_script: build:linux
          - os: macos-14
            platform: mac
            arch: amd64
            build_script: build:mac
            preview_build_script: build:mac:preview
          - os: windows-2022
            platform: win
            arch: amd64
            build_script: build:win
            preview_build_script: build:win
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          echo "AM_VERSION=${{ needs.set-version.outputs.version }}" >> "$GITHUB_ENV"
          if [[ "${{ github.ref_name }}" == "main" && "${{ contains(needs.set-version.outputs.version, 'alpha') }}" != "true" && "${{ contains(needs.set-version.outputs.version, 'beta') }}" != "true" ]]; then
            echo "IS_STABLE_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_STABLE_RELEASE=false" >> "$GITHUB_ENV"
          fi
        shell: bash

      - uses: actions/download-artifact@v4
        with:
          name: accessmod-docker-archive-${{ matrix.arch }}
          path: ./electron/resources/docker/

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Dependencies
        working-directory: ./electron
        run: yarn install

      - name: Prepare Apple API key
        if: ${{ matrix.platform == 'mac' && github.ref_name == 'main' && !contains(needs.set-version.outputs.version, 'alpha') && !contains(needs.set-version.outputs.version, 'beta') }}
        run: |
          mkdir -p "$RUNNER_TEMP/apple-notarization"
          key_path="$RUNNER_TEMP/apple-notarization/AuthKey_${APPLE_API_KEY_ID}.p8"
          if base64 --help 2>&1 | grep -q -- "--decode"; then
            printf "%s" "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"
          else
            printf "%s" "$APPLE_API_KEY_BASE64" | base64 -D > "$key_path"
          fi
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}

      - name: Check Apple notarization access
        if: ${{ matrix.platform == 'mac' && github.ref_name == 'main' && !contains(needs.set-version.outputs.version, 'alpha') && !contains(needs.set-version.outputs.version, 'beta') }}
        run: xcrun notarytool history --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # Build using the predefined scripts in package.json
      - name: Build Electron App
        working-directory: ./electron
        run: |
          if [[ "${{ matrix.platform }}" == "mac" && "$IS_STABLE_RELEASE" != "true" ]]; then
            yarn ${{ matrix.preview_build_script }}
          else
            yarn ${{ matrix.build_script }}
          fi
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform != 'mac' && 'false' || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && github.ref_name == 'main' && !contains(needs.set-version.outputs.version, 'alpha') && !contains(needs.set-version.outputs.version, 'beta') && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && github.ref_name == 'main' && !contains(needs.set-version.outputs.version, 'alpha') && !contains(needs.set-version.outputs.version, 'beta') && secrets.APPLE_API_ISSUER || '' }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.APPLE_CERTIFICATE_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: accessmod-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ./electron/dist/*.dmg
            ./electron/dist/*.deb
            ./electron/dist/*-setup.exe

  # Release on main if not pre-release
  release:
    runs-on: ubuntu-latest
    needs: [set-version, docker, qemu, electron]
    # Only create releases when on main branch and not alpha/beta versions
    if: ${{ github.ref_name == 'main' && !contains(needs.set-version.outputs.version, 'alpha') && !contains(needs.set-version.outputs.version, 'beta') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        run: echo "AM_VERSION=${{ needs.set-version.outputs.version }}" >> "$GITHUB_ENV"

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./accessmod-release
          pattern: accessmod-*

      - name: List files for release
        run: ls -R ./accessmod-release

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.AM_VERSION }}
          files: |
            ./accessmod-release/**/*.deb
            ./accessmod-release/**/*.dmg
            ./accessmod-release/**/*.exe
            ./accessmod-release/**/*.ova
          body_path: ./release_notes.md
          token: ${{ secrets.github_token }}
